name: Morning screen (07:00 IST)

on:
  schedule:
    - cron: "30 1 * * 1-5"   # 07:00 IST, Mon-Fri (IST has no DST; fixed UTC+5:30 offset)
  workflow_dispatch: {}       # lets you trigger it manually from the Actions tab to test

permissions:
  contents: write

jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e '.[dev]'
      - uses: ./.github/actions/restore-state
      - run: tradalgo init
      - run: tradalgo screen --date "$(TZ=Asia/Kolkata date +%F)"
        env:
          FYERS_APP_ID: ${{ secrets.FYERS_APP_ID }}
          FYERS_SECRET_KEY: ${{ secrets.FYERS_SECRET_KEY }}
          FYERS_PIN: ${{ secrets.FYERS_PIN }}
          FYERS_REFRESH_TOKEN: ${{ secrets.FYERS_REFRESH_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - run: tradalgo worker &
        env:
          FYERS_APP_ID: ${{ secrets.FYERS_APP_ID }}
          FYERS_SECRET_KEY: ${{ secrets.FYERS_SECRET_KEY }}
          FYERS_PIN: ${{ secrets.FYERS_PIN }}
          FYERS_REFRESH_TOKEN: ${{ secrets.FYERS_REFRESH_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        # `tradalgo worker` is the always-on job that actually sends queued Telegram messages and runs
        # daily maintenance; there is no long-lived worker process on GitHub Actions, so run it for a
        # few seconds here (enough to flush today's shortlist alert and any due maintenance) then stop it.
        continue-on-error: true
      - run: sleep 20 && pkill -f "tradalgo worker" || true
      - uses: ./.github/actions/save-state
        if: always()
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screen-logs-${{ github.run_id }}
          path: |
            data/logs/**
            data/tradalgo.db
          retention-days: 90
