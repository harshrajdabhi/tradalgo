fyers:
  redirect_uri: "https://127.0.0.1:5000/"   # must match the redirect URL registered on your FYERS API app

capital:
  initial_capital: 20000
  max_risk_pct: 0.03
  max_leverage: 5
  fallback_leverage: 3
  fixed_cost_rupees: 50   # unused since v2: charges are modeled in costs: below
  max_trades_per_day: 2
  daily_loss_limit_r: 2

# Approximate FYERS equity intraday charges — verify against https://fyers.in/charges before trusting results.
costs:
  brokerage_pct_per_order: 0.0003   # min(0.03% of order value, cap)
  brokerage_cap_per_order: 20.0
  stt_sell_pct: 0.0002
  exchange_txn_pct: 0.0000297
  sebi_per_crore: 10.0
  stamp_buy_pct: 0.00003
  gst_pct: 0.18                     # on brokerage + exchange + SEBI
  ipft_per_crore: 0.0

screener:
  shortlist_size: 6
  min_avg_turnover_cr: 50
  min_price: 50
  factor_weights:
    momentum_trend: 0.20
    relative_strength: 0.15
    volatility: 0.15
    relative_volume: 0.15
    structure: 0.15
    level_proximity: 0.10
    news_sentiment: 0.10
  stop_atr_frac: 0.3
  trigger_zone_atr: 0.25
  min_room_r: 2.0

market:
  timezone: Asia/Kolkata
  open: "09:15"
  close: "15:30"
  no_new_entries_after: "14:00"
  hard_exit: "15:00"

strategies:
  orb:            {enabled: true, window_start: "09:30", window_end: "11:00"}
  gap:            {enabled: true, window_start: "09:20", window_end: "10:15"}
  vwap:           {enabled: true, window_start: "09:30", window_end: "14:00"}
  pdhl:           {enabled: true, window_start: "09:30", window_end: "14:00"}
  pullback:       {enabled: true, window_start: "09:30", window_end: "14:00"}
  range_breakout: {enabled: true, window_start: "09:30", window_end: "14:00"}

# Per-strategy detector tunables go in strategies.<name>.params (e.g. orb: {..., params: {min_rvol: 2.0}});
# unknown keys are rejected. See tradalgo/strategies/<name>.py DEFAULTS.

position_management:
  partial_exit_fraction: 0.6
  partial_exit_at_r: 2.0          # partial fires here; runner exits at runner_target_r
  breakeven_after_partial: true
  runner_target_r: 3.0
  stop_atr_min: 0.5               # detector stops bounded to [min, max] x ATR14(5m)
  stop_atr_max: 2.0

regime:
  adx_trend: 25.0
  high_vol_pct: 90.0
  range_mult: 1.5
  range_lookback_sessions: 10
  vol_lookback_sessions: 20
  adx_period: 14
  ema_period: 20
  min_bars: 40

backtest:
  slippage_pct: 0.05

risk:
  win_prob: 0.40
  runner_avg_r: 2.0
  min_room_r: 2.0
  band_fraction_r: 0.1
  trail_bars: 3

preopen:
  max_gap_atr: 0.75
  oppose_gap_atr: 0.5

telegram:
  enabled: true   # token and chat id live in macOS Keychain (TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID)

dashboard:
  host: 127.0.0.1
  port: 8501

paths:
  data_dir: data
  static_dir: data_static
