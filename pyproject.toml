[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tradalgo"
version = "0.1.0"
description = "NSE intraday stock screener and alert system (alerts only, never places orders)"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "PyYAML>=6.0",
    "SQLAlchemy>=2.0",
    "keyring>=24",
    "pandas>=2.1",
    "pyarrow>=15",
    "requests>=2.31",
    "fyers-apiv3>=3.1",
    "yfinance>=0.2.40",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
tradalgo = "tradalgo.cli:main"

[tool.setuptools.packages.find]
include = ["tradalgo*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
